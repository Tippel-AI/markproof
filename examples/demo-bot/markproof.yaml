#
# Points markproof at the local demo-bot — chat and media in one run.
# Start the bot first, e.g.:
#   DEMO_MODE=fail uvicorn app:app --port 8099
version: 1

target:
  name: demo-bot
  probes:
    - id: chat
      type: http-chat
      url: http://127.0.0.1:8099/v1/chat/completions
      dialect: openai-chat
      lang: de
      model: demo

    - id: images
      type: media
      url: http://127.0.0.1:8099/v1/images/generations
      model: demo
      prompt: "Ein einfaches Testbild."
      response_format: url

text_marking:
  method: synthid
  # The operator's generation-side parameters. In production these keys are a
  # secret — anyone holding them can verify *and* forge the mark.
  #
  # The file is called *.demo.json rather than watermark_config.json on purpose:
  # it holds three throwaway keys for a bot that serves fixed strings, and the
  # config schema forbids unknown fields, so the name is the only marking that
  # survives someone copying the file out of this repository as a template. Do
  # not mark production output with those keys. See README.md § watermark
  # config.
  watermark_config: watermark_config.demo.json

rulepack: art50-eu-2026.07
