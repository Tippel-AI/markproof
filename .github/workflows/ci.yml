#
# Per-PR pipeline: lint, types, tests on 3.11/3.12/3.13, plus the determinism
# gate. Deliberately runs WITHOUT the optional extras — the default path has to
# stay installable with zero system dependencies (Auflage A2).
#
# Siblings that already exist: dogfood.yml (the demo target, badge included) and
# release.yml (tag -> PyPI via Trusted Publishing). Still to come: extras.yml
# (playwright + synthid, nightly) and canary.yml (unpinned c2pa-python and
# transformers, nightly). The SPDX-header lint needs no workflow of its own — it
# runs in the lint job below, out of .pre-commit-config.yaml. There is no
# generated dependency-licence inventory and NOTICE no longer promises one:
# nothing here is vendored, so the direct-dependency list in NOTICE section 4 is
# the whole obligation.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --python 3.11 --extra dev ruff check .
      - name: ruff format --check
        run: uv run --python 3.11 --extra dev ruff format --check .
      # The SPDX-header ground rule from CONTRIBUTING.md. A hook a contributor
      # has to install locally is a suggestion; run here it is the rule.
      - name: SPDX headers
        run: uv run --python 3.11 --extra dev pre-commit run spdx-header --all-files

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: mypy
        run: uv run --python 3.11 --extra dev mypy

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: pytest
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest

  determinism:
    name: determinism (byte-identical report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # Every golden evidence file goes through the full pipeline twice and the
      # canonical JSON has to be byte-identical, then still match the reviewed
      # report on disk. A diff in a golden is a change in what the tool calls
      # conformant; it is reviewed, never refreshed away.
      #
      # This job was a placeholder that ran three echo statements and went green
      # for the whole of M1-M6. A green check verifying nothing is the exact
      # failure this project exists to catch elsewhere, so if it ever has nothing
      # to run again, it fails instead of passing quietly.
      - name: determinism gate
        run: uv run --extra dev pytest -m determinism

      - name: the gate is not empty
        run: |
          cases=$(find tests/golden -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "golden cases: $cases"
          if [ "$cases" -lt 5 ]; then
            echo "::error title=determinism::only $cases golden cases — the gate is not covering the pipeline"
            exit 1
          fi
